<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.0-beta1/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-giJF6kkoqNQ00vy+HMDP7azOuL0xtbfIcaT9wjKHr8RbDVddVHyTfAAsrekwKmP1" crossorigin="anonymous">
    <title>Webshop</title>
</head>
<body>
    <div>
        <h1 class="text-center m-4">Webshop</h1>
    </div>
    <div class="container-md d-flex justify-content-center p-4 flex-column gap-2 w-25">
        <input type="text" id="newName" placeholder="Name">
        <input type="email" id="newEmail" placeholder="Email">
        <input type="text" id="newCity" placeholder="City">
        <input type="text" id="newPhone" placeholder="Phone">
        <select type="text" id="newRole"  class="form-select">
            <option value="customer">customer</option>
            <option value="admin">admin</option>
           
        </select>
        <button class="btn btn-primary" id="addUserBtn">Add User</button>
    </div>
    <div class="container-fluid p-4 w-50">
        <table class="table table-striped table-dark table-hover"> 
            <thead>
                <tr >
                    <th>Name</th>
                    <th>Email</th>
                    <th>City</th>
                    <th>Phone</th>
                    <th>Role</th>
                    <th>Módosítás</th>
                    <th>Törlés</th>
                </tr>
            </thead>
            <tbody id="data">
               
            </tbody>

        </table>
    </div>
    
    <script src="app.js"></script>
</body>
</html>
